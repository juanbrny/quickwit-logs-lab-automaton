<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="diagTitle diagDesc">
<title id="diagTitle">Quickwit logs lab architecture</title>
<desc id="diagDesc">Logs enter through Traefik and Vector, are indexed by Quickwit into an S3 object store whose backend is pluggable (SeaweedFS, AIStor or an external S3), with PostgreSQL as the metastore. Reads arrive from Grafana, the Quickwit UI and two MCP servers, and are served by the Quickwit searcher.</desc>
