[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
stdout_callback = ansible.builtin.default
callback_result_format = yaml

#interpreter_python = auto_silent
#interpreter_python = /Users/coco/.venv/byoc/bin/python

[ssh_connection]
# Several tasks run helm with wait: true and wait_timeout: 600s. Helm prints
# nothing while it waits, so the SSH channel goes completely silent for minutes.
# Anything with an idle timeout in the path (NAT, VPN, sshd ClientAliveInterval)
# then closes it, and Ansible reports UNREACHABLE even though the task on the
# node succeeded — the workloads come up fine and the helm release says
# "deployed", which makes it look like a cluster problem rather than a transport
# one.
#
# ServerAliveInterval sends traffic every 15s so the connection is never idle.
# ServerAliveCountMax=40 tolerates 10 minutes of an unresponsive server, which
# covers the longest wait_timeout in this repo.
# ControlPersist is raised past that same 600s so the multiplexed master socket
# is not torn down mid-play.
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=15 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes
