---
# Raw VM spec required. group_vars/all/main.yml overrides these for the lab
# (8 vCPU / 32 GB / 50 GB) — change them there, not here.
preflight_required_vcpu: 8
preflight_required_ram_gb: 32
preflight_required_disk_gb: 100
preflight_disk_path: /
preflight_skip: false          # -e preflight_skip=true to bypass
