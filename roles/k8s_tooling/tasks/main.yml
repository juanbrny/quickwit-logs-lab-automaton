---
# The kubernetes.core modules execute on whichever host runs the task, so when
# that host is the node it needs helm, the python kubernetes client, and (for
# the mc probes) kubectl. k3s ships kubectl, so we just expose it on PATH.
- name: Ensure base tooling is present (python, pip, tar for unarchive)
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - tar
      - gzip
    state: present

- name: Install the python kubernetes client (needed by kubernetes.core)
  ansible.builtin.pip:
    name:
      - kubernetes>=24.2.0
      - PyYAML
    extra_args: "{{ '--break-system-packages' if k8s_tooling_pip_break_system_packages else omit }}"

- name: Check for helm
  ansible.builtin.command: helm version --short
  register: helm_check
  changed_when: false
  failed_when: false

# Presence alone is not enough: a node provisioned by an earlier run can carry a
# helm too old for the charts we install. SeaweedFS 4.x uses fromToml, which
# only exists from helm 3.17.0, and fails at template-parse time on 3.16.x.
- name: Determine the installed helm version
  ansible.builtin.set_fact:
    helm_installed_version: >-
      {{ (helm_check.stdout | default('') | regex_search('[0-9]+\.[0-9]+\.[0-9]+')) | default('0.0.0', true) }}

- name: Install helm
  when: >-
    helm_check.rc != 0
    or helm_installed_version is version(helm_version | regex_replace('^v', ''), '<')
  block:
    # Every path here is keyed by helm_version. With a fixed /tmp/helm.tar.gz,
    # get_url (force: false by default) skips the download whenever the file
    # exists, so a version bump silently reused the PREVIOUS tarball and the old
    # binary stayed installed — three no-ops in a row and no error anywhere.
    - name: Download helm {{ helm_version }}
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: "/tmp/helm-{{ helm_version }}.tar.gz"
        mode: "0640"

    - name: Create the unpack directory for helm {{ helm_version }}
      ansible.builtin.file:
        path: "/tmp/helm-{{ helm_version }}"
        state: directory
        mode: "0750"

    - name: Unpack helm {{ helm_version }}
      ansible.builtin.unarchive:
        src: "/tmp/helm-{{ helm_version }}.tar.gz"
        dest: "/tmp/helm-{{ helm_version }}"
        remote_src: true

    - name: Install the helm binary
      ansible.builtin.copy:
        src: "/tmp/helm-{{ helm_version }}/linux-amd64/helm"
        dest: /usr/local/bin/helm
        mode: "0755"
        remote_src: true

    # sudo's secure_path often omits /usr/local/bin, so the helm modules (run
    # under become) can't find it there. Symlink into /usr/bin, which is always
    # on secure_path.
    - name: Expose helm on the secure_path
      ansible.builtin.file:
        src: /usr/local/bin/helm
        dest: /usr/bin/helm
        state: link
        force: true

    - name: Confirm the installed helm is the pinned version
      ansible.builtin.command: helm version --short
      register: helm_after
      changed_when: false

    - name: Fail if helm did not actually change
      ansible.builtin.assert:
        that:
          - (helm_after.stdout | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+'))
            is version(helm_version | regex_replace('^v', ''), '>=')
        fail_msg: >-
          helm still reports {{ helm_after.stdout }} after installing
          {{ helm_version }}. Check for another helm earlier on PATH
          (which -a helm).
        quiet: true

# k3s installs its own kubectl but does not always symlink it. Target /usr/bin
# (on sudo's secure_path) so it's found under become, not /usr/local/bin.
- name: Expose kubectl on PATH
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/bin/kubectl
    state: link
    force: true
