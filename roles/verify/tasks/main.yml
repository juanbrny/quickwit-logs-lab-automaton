---
- name: Wait for all Quickwit pods to be Ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready pods --all
    -n {{ quickwit_namespace }} --timeout={{ verify_pod_timeout }}
  changed_when: false

- name: Wait for all Grafana pods to be Ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready pods --all
    -n {{ grafana_namespace }} --timeout={{ verify_pod_timeout }}
  changed_when: false

# The chart's appVersion is still v0.8.2, so `image.tag` is the only thing
# putting 0.9 on the node. Assert the engine that actually answers is the one we
# pinned, instead of trusting the values file.
- name: Ask the running cluster which version it is
  ansible.builtin.uri:
    url: "http://{{ node_ip }}/api/v1/version"
    method: GET
    status_code: [200]
  register: qw_version
  retries: 12
  delay: 10
  until: qw_version is succeeded
  changed_when: false

# Quickwit reports its version with a "v" prefix (and nightly builds add a
# suffix). Ansible's version test parses component-wise, so comparing "v0.9.0"
# against "0.9.0" tries to order the string "v" against the integer 0 and blows
# up. Extract the bare X.Y.Z first.
- name: Extract the reported engine version
  ansible.builtin.set_fact:
    qw_reported_version: >-
      {{ (qw_version.json.build.version | default('') | regex_search('[0-9]+\.[0-9]+\.[0-9]+'))
         | default('0.0.0', true) }}

- name: Assert the running engine is the pinned version
  ansible.builtin.assert:
    that:
      - qw_version.json.build.version is defined
      - qw_reported_version is version(verify_expected_qw_version, '>=')
      - qw_reported_version.startswith(verify_expected_qw_major_minor)
    fail_msg: >-
      Expected Quickwit {{ verify_expected_qw_major_minor }}.x but the cluster
      reports {{ qw_version.json.build.version | default('unknown') }}
      (parsed as {{ qw_reported_version }}). Check
      quickwit_image_tag in group_vars/all/versions.yml — the chart falls back
      to its own appVersion (0.8.x) if image.tag is unset.
    success_msg: >-
      Quickwit {{ qw_version.json.build.version }}
      ({{ qw_version.json.build.build_target | default('unknown target') }})
    quiet: true

- name: Reap leftover mc helper pods
  ansible.builtin.include_role:
    name: mc_helpers
    tasks_from: reap
  vars:
    mc_reap_namespace: "{{ s3_namespace }}"
    mc_reap_pods: ["mc-ls-wal"]

- name: Check WAL archiving reached the bucket
  vars:
    mc_app_url: "{{ s3_scheme }}://{{ s3_access_key }}:{{ s3_secret_key }}@{{ s3_host }}:{{ s3_port }}"
  ansible.builtin.command:
    cmd: >
      kubectl run mc-ls-wal --rm -i --restart=Never
      -n {{ s3_namespace }} --image={{ mc_image }}
      --env=MC_HOST_s3={{ mc_app_url }}
      --command -- mc {{ mc_opts }} ls -r s3/{{ cnpg_backup_bucket }}/{{ cnpg_cluster_name }}/
  register: wal_ls
  changed_when: false
  failed_when: false

- name: Report WAL archiving status
  ansible.builtin.debug:
    msg: >-
      {{ 'WAL archiving OK — objects present in s3://' + cnpg_backup_bucket
         if (wal_ls.stdout | length > 0)
         else 'No WAL objects yet — may need a few minutes after first startup' }}

# The seed index is created by a helm post-install hook Job, which can still be
# running when helm returns.
- name: Wait for the seed index to exist
  ansible.builtin.uri:
    url: "http://{{ node_ip }}/api/v1/indexes/{{ quickwit_index_id }}"
    method: GET
    status_code: [200]
  register: qw_index
  retries: 12
  delay: 10
  until: qw_index is succeeded
  changed_when: false

# Ingest V2 is the default in 0.9 and serves this path. The body is NDJSON —
# one JSON document per line, NOT a JSON array. commit=force makes the split
# searchable straight away instead of waiting for commit_timeout_secs.
- name: Push a test log through the ingress
  ansible.builtin.uri:
    url: "http://{{ node_ip }}/api/v1/{{ quickwit_index_id }}/ingest?commit=force"
    method: POST
    headers:
      Content-Type: application/x-ndjson
    body_format: raw
    body: "{{ verify_test_doc | to_json }}\n"
    status_code: [200]
  register: test_log
  retries: 6              # the indexer may still be warming up right after install
  delay: 10
  until: test_log is succeeded
  changed_when: false

# Accepting the write is not the same as being able to read it back. This is the
# check that catches a broken S3 endpoint or a bad metastore URI.
- name: Search the test log back out
  ansible.builtin.uri:
    url: >-
      http://{{ node_ip }}/api/v1/{{ quickwit_index_id }}/search?query={{ verify_search_query | urlencode }}
    method: GET
    status_code: [200]
  register: qw_search
  retries: 12
  delay: 10
  until:
    - qw_search is succeeded
    - (qw_search.json.num_hits | default(0)) > 0
  changed_when: false

- name: Grafana answers on the Traefik path
  ansible.builtin.uri:
    url: "http://{{ node_ip }}{{ grafana_subpath }}/api/health"
    method: GET
    status_code: [200]
  register: gf_health
  retries: 12
  delay: 10
  until: gf_health is succeeded
  changed_when: false

- name: Grafana answers on the NodePort
  ansible.builtin.uri:
    url: "http://{{ node_ip }}:{{ grafana_nodeport }}{{ grafana_subpath }}/api/health"
    method: GET
    status_code: [200]
  register: gf_health_np
  retries: 6
  delay: 10
  until: gf_health_np is succeeded
  changed_when: false

# End-to-end proof that the plugin loaded AND can reach Quickwit: Grafana runs
# the datasource's own health check against the searcher.
- name: Grafana can reach Quickwit through the provisioned datasource
  ansible.builtin.uri:
    url: >-
      http://{{ node_ip }}{{ grafana_subpath }}/api/datasources/uid/{{ grafana_datasource_uid }}/health
    method: GET
    url_username: "{{ grafana_admin_user }}"
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200]
  register: gf_ds
  retries: 12             # the plugin is downloaded and installed on first boot
  delay: 10
  until: gf_ds is succeeded
  changed_when: false
  no_log: true

# The MCP server refuses unauthenticated callers, so a 401 here still proves it
# is listening and enforcing auth. Only "nothing answered" is a failure.
- name: MCP server answers on the Traefik path
  ansible.builtin.uri:
    url: "http://{{ node_ip }}{{ grafana_mcp_subpath }}"
    method: GET
    status_code: [200, 400, 401, 405, 406]
  register: mcp_http
  retries: 12
  delay: 10
  until: mcp_http is succeeded
  changed_when: false

- name: MCP server answers on the NodePort
  ansible.builtin.uri:
    url: "http://{{ node_ip }}:{{ grafana_mcp_nodeport }}{{ grafana_mcp_subpath }}"
    method: GET
    status_code: [200, 400, 401, 405, 406]
  register: mcp_np
  retries: 6
  delay: 10
  until: mcp_np is succeeded
  changed_when: false

# A real MCP handshake with the caller token. This proves the token, the
# transport and the Grafana service account all line up — an LLM client would
# fail here if any of the three were wrong.
- name: MCP initialize handshake succeeds with the caller token
  ansible.builtin.uri:
    url: "http://{{ node_ip }}{{ grafana_mcp_subpath }}"
    method: POST
    headers:
      Authorization: "Bearer {{ grafana_mcp_caller_token }}"
      Content-Type: application/json
      Accept: "application/json, text/event-stream"
    body_format: json
    body:
      jsonrpc: "2.0"
      id: 1
      method: initialize
      params:
        protocolVersion: "2025-06-18"
        capabilities: {}
        clientInfo:
          name: ansible-verify
          version: "1.0"
    status_code: [200]
  register: mcp_init
  retries: 12
  delay: 10
  until: mcp_init is succeeded
  changed_when: false
  no_log: true

- name: All good
  ansible.builtin.debug:
    msg:
      - >-
        Quickwit {{ qw_version.json.build.version }} on
        {{ qw_version.json.build.build_target | default('unknown target') }}
      - "Test log indexed and searchable — {{ qw_search.json.num_hits }} hit(s) in '{{ quickwit_index_id }}'."
      - "Quickwit UI:        http://{{ node_ip }}/ui"
      - "Grafana:            http://{{ node_ip }}{{ grafana_subpath }}"
      - "Grafana (NodePort): http://{{ node_ip }}:{{ grafana_nodeport }}{{ grafana_subpath }}"
      - "MCP endpoint:       http://{{ node_ip }}{{ grafana_mcp_subpath }}"
      - "MCP (NodePort):     http://{{ node_ip }}:{{ grafana_mcp_nodeport }}{{ grafana_mcp_subpath }}"
